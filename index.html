<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine? 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff6b9d 0%, #ffc3d7 50%, #ff6b9d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 600px;
        }

        .heart-icon {
            font-size: 120px;
            animation: heartbeat 1.5s ease-in-out infinite;
            margin-bottom: 30px;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.1); }
            50% { transform: scale(1); }
        }

        h1 {
            color: white;
            font-size: 3em;
            margin-bottom: 50px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .buttons-container {
            position: relative;
            height: 250px;
            margin-top: 50px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 30px;
        }

        button {
            font-size: 1.5em;
            padding: 20px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        #yesBtn {
            background: linear-gradient(135deg, #ff1744, #ff4569);
            color: white;
            position: relative;
            z-index: 10;
        }

        #yesBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 23, 68, 0.4);
        }

        #noBtn {
            background: linear-gradient(135deg, #ffffff, #f0f0f0);
            color: #ff1744;
            position: relative;
            transition: all 0.2s ease;
        }
        
        #noBtn.moving {
            position: absolute;
        }

        .celebration {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .celebration.active {
            display: flex;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .celebration h2 {
            font-size: 4em;
            color: white;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
            animation: bounceIn 1s ease;
            margin-bottom: 30px;
        }

        @keyframes bounceIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        .heart {
            position: absolute;
            font-size: 30px;
            animation: float 4s ease-in infinite;
            opacity: 0;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2em; }
            button { font-size: 1.2em; padding: 15px 30px; }
            .celebration h2 { font-size: 2.5em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="question">
            <div class="heart-icon">💕</div>
            <h1>Will You Be My Valentine?</h1>
            <div class="buttons-container">
                <button id="yesBtn">Yes! 💖</button>
                <button id="noBtn">No</button>
            </div>
        </div>

        <div class="celebration" id="celebration">
            <h2>My Valentine Forever ❤️</h2>
            <div class="heart-icon">💑</div>
        </div>
    </div>

    <div class="hearts" id="hearts"></div>

    <audio id="loveMusic" preload="auto">
        <source src="Gehra_Hua__From_Dhurandhar___Arijit_Singh__Shashwat_Sachdev__Irshad_Kamil__Armaan_Khan.mp3" type="audio/mpeg">
    </audio>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const question = document.getElementById('question');
        const celebration = document.getElementById('celebration');
        const heartsContainer = document.getElementById('hearts');
        const music = document.getElementById('loveMusic');
        
        let noBtnSize = 1;
        let yesBtnSize = 1;
        let attempts = 0;

        // Make "No" button run away
        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('click', moveButton);

        function moveButton() {
            attempts++;
            
            // Add moving class on first attempt
            if (attempts === 1) {
                noBtn.classList.add('moving');
            }
            
            // Shrink "No" button
            noBtnSize = Math.max(0.5, noBtnSize - 0.1);
            
            // Grow "Yes" button
            yesBtnSize += 0.2;
            yesBtn.style.transform = `scale(${yesBtnSize})`;
            
            // Move "No" button to random position
            const container = document.querySelector('.buttons-container');
            const maxX = container.offsetWidth - noBtn.offsetWidth - 20;
            const maxY = container.offsetHeight - noBtn.offsetHeight - 20;
            
            const randomX = Math.max(20, Math.random() * maxX);
            const randomY = Math.max(20, Math.random() * maxY);
            
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
            noBtn.style.transform = `scale(${noBtnSize})`;

            // Add desperate prompts
            if (attempts === 3) {
                noBtn.textContent = "Please? 🥺";
            } else if (attempts === 6) {
                noBtn.textContent = "Pretty please? 💕";
            } else if (attempts === 10) {
                noBtn.textContent = "Just click Yes! 😊";
                noBtn.style.opacity = '0.5';
            }
        }

        // "Yes" button celebration
        yesBtn.addEventListener('click', () => {
            question.style.display = 'none';
            celebration.classList.add('active');
            
            // Play music
            music.play().catch(e => console.log('Audio autoplay prevented:', e));
            
            // Create floating hearts
            createHearts();
        });

        function createHearts() {
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart';
                    heart.textContent = ['❤️', '💕', '💖', '💗', '💓'][Math.floor(Math.random() * 5)];
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.animationDelay = Math.random() * 2 + 's';
                    heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
                    heartsContainer.appendChild(heart);
                    
                    setTimeout(() => heart.remove(), 7000);
                }, i * 100);
            }
        }
    </script>
</body>
</html>
